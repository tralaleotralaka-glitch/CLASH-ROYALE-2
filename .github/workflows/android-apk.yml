name: Android APK

on:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'public/**'
      - 'src/**'
      - 'test/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.js'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an APK to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.apk.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Check runner Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Assemble APK
        run: gradle --project-dir android --no-daemon :app:assembleDebug
      - name: Verify signature and prepare download
        id: apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Clash-Royale-Arena.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Clash-Royale-Arena.apk
          unzip -tq Clash-Royale-Arena.apk assets/www/index.html assets/www/art/arena.jpg
          version=$(sed -n "s/.*versionName '\([0-9.]*\)'.*/\1/p" android/app/build.gradle)
          test -n "$version"
          echo "tag=android-v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Clash-Royale-Arena-APK
          path: Clash-Royale-Arena.apk
          if-no-files-found: error

  publish:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish android]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Clash-Royale-Arena-APK
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" Clash-Royale-Arena.apk \
            --target "$GITHUB_SHA" \
            --title "Clash Royale — Арена · ${RELEASE_TAG#android-v}" \
            --notes 'APK для Android 8.0 и новее с актуальным Android System WebView. Неофициальная офлайн-игра против бота. Сборка подписана отладочным ключом.'
